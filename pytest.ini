[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    # unittest.mock's AsyncMock can leave an un-awaited coroutine that is only
    # reported at garbage-collection time, cross-attributed between tests. It is
    # a benign test-harness artifact, not a product defect, so silence just this.
    ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning
